server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las referencias de voz pueden pesar hasta 60 MB (MAX_BYTES_REFERENCIA en backend/app/nucleo/ajustes.py)
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://clonar-voz-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Progreso en vivo por SSE: sin búfer y sin cortar las síntesis largas
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Los assets de Vite llevan hash en el nombre: se pueden cachear sin miedo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
