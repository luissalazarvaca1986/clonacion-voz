# Sala de conversación (clonar-voz-conversa) por HTTPS.
# Los navegadores solo dejan usar el micrófono en HTTPS o en localhost, así que
# para entrar desde el celular u otro equipo de la LAN se usa https://<IP>:9443.
# Certificado autofirmado en nginx/certs (el navegador pedirá aceptarlo una vez).
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/conversa.crt;
    ssl_certificate_key /etc/nginx/certs/conversa.key;

    client_max_body_size 64m;

    location / {
        proxy_pass http://clonar-voz-conversa:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Eventos del turno por SSE: sin búfer y sin cortar respuestas largas
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
