services:
  clonar-voz-backend:
    # API FastAPI + llama-tts (CUDA). Swagger en /api/docs
    build:
      context: ./backend
      args:
        CUDA_ARCHITECTURES: "121"   # GB10 (DGX Spark, Blackwell)
    image: clonar-voz-backend:cuda
    container_name: clonar-voz-backend
    user: "1000:1000"
    ports:
      - "8093:8080"
    volumes:
      - ./modelo:/app/modelo     # .gguf (se descargan desde la web la primera vez)
      - ./audios:/app/audios     # referencias/ (voces a clonar) y generados/ (síntesis)
      - ./avatares:/app/avatares # una carpeta por avatar: avatares/Luis/ (imagen + 3 fondos)
      - ./videos:/app/videos     # Meet-Videos generados (MP4)
      - ./config:/app/config     # config.json con los ajustes guardados
      - ./cache/cuda:/app/cache/cuda  # kernels CUDA ya compilados (sin él, 1.ª síntesis ~70 s)
      - ./modelos-llm:/app/modelos-llm:ro   # Qwen3.5 2B para el análisis emocional
      - ./cache/animacion:/app/animacion    # área de trabajo compartida con el animador
    environment:
      - CLONAR_DIR_MODELO=/app/modelo
      # TTS por defecto (lo que la web propone la primera vez); se cambia en la web o en .env
      - CLONAR_TTS_MODELO=${TTS_MODELO:-/app/modelo/Qwen3-TTS-12Hz-1.7B-Base-Q8_0.gguf}
      - CLONAR_TTS_MMPROJ=${TTS_MMPROJ:-/app/modelo/mmproj-Qwen3-TTS-12Hz-1.7B-Base-Q8_0.gguf}
      - CLONAR_DIR_VOCES=/app/audios/referencias
      - CLONAR_DIR_SALIDAS=/app/audios/generados
      - CLONAR_CONFIG=/app/config/config.json
      - CLONAR_DIR_AVATARES=/app/avatares
      - CLONAR_DIR_VIDEOS=/app/videos
      # LLM bajo demanda: el backend lo carga solo mientras etiqueta emociones
      - CLONAR_LLM_MODELO=/app/modelos-llm/Qwen3.5-2B-Q4_K_M.gguf
      - CLONAR_LLM_HILOS=6
      - CLONAR_ANIMADOR_URL=http://clonar-voz-animador:8080
      - CLONAR_MONGO_URL=mongodb://clonar-voz-mongo:27017
      - CLONAR_DIR_ANIMACION=/app/animacion
      # LLM siempre cargado en la GPU (clonar-voz-llm), compartido con la conversación
      - CLONAR_LLM_URL=http://clonar-voz-llm:8080
      # Tareas de síntesis/animación simultáneas: pipeline de clips en paralelo
      - CLONAR_GPU_CONCURRENCIA=3
      # Caché de kernels CUDA compilados (acelera el primer arranque)
      - CUDA_CACHE_PATH=/app/cache/cuda
      - CUDA_CACHE_MAXSIZE=1073741824
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      clonar-voz-mongo:
        condition: service_healthy
    networks:
      clonar-voz-net:
        ipv4_address: 192.168.93.10
    restart: unless-stopped

  clonar-voz-mongo:
    # Proyectos (cada generación del historial) con la configuración de sus segmentos
    # 8.2: las versiones «8» y «latest» locales no arrancan en kernels Linux ≥ 6.19
    # (SERVER-121912); esta sí, y el host usa el 7.0
    image: mongo:8.2
    container_name: clonar-voz-mongo
    user: "1000:1000"
    ports:
      - "127.0.0.1:27018:27017"   # solo local: para inspeccionar con Compass/mongosh
    volumes:
      - ./datos/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      clonar-voz-net:
        ipv4_address: 192.168.93.15
    restart: unless-stopped

  clonar-voz-animador:
    # Animación facial del avatar (SadTalker) en un entorno aislado: Python 3.8 +
    # torch 1.12.1/CUDA 11.3. Sin modelos en memoria mientras está en reposo: cada
    # animación es un proceso que carga los pesos y los libera al terminar.
    build:
      context: ./animador
    image: clonar-voz-animador:sadtalker
    container_name: clonar-voz-animador
    user: "1000:1000"
    volumes:
      - ./modelos-animacion:/modelos:ro   # pesos de SadTalker (fuera del repo y de la imagen)
      - ./cache/animacion:/trabajo         # área de trabajo compartida con el backend
    environment:
      - ANIMADOR_CONCURRENCIA=3
      # Render facial a 512 con mejora GFPGAN (la 1650 se queda en 256 sin mejora)
      - ANIMADOR_TAMANOS=256,512
      - ANIMADOR_TAMANO=${ANIMADOR_TAMANO:-512}
      - ANIMADOR_MEJORA=${ANIMADOR_MEJORA:-gfpgan}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/salud', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      clonar-voz-net:
        ipv4_address: 192.168.93.14
    restart: unless-stopped

  clonar-voz-front-build:
    # Compila el front de React (Vite) en ./html y termina. Para recompilar:
    #   docker compose run --rm clonar-voz-front-build
    image: node:22-alpine
    container_name: clonar-voz-front-build
    user: "1000:1000"
    working_dir: /front
    command: sh -c "npm install --no-audit --no-fund && npm run build -- --outDir /html --emptyOutDir"
    volumes:
      - ./front:/front
      - ./html:/html
    networks:
      clonar-voz-net:
        ipv4_address: 192.168.93.12
    restart: "no"

  clonar-voz-front:
    # nginx sirve el compilado de ./html y reenvía /api al backend
    image: nginx:1.27-alpine
    container_name: clonar-voz-front
    ports:
      - "8094:80"
      - "9443:443"                         # sala de conversación por HTTPS (micrófono en la LAN)
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conversa-https.conf:/etc/nginx/conf.d/conversa-https.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      clonar-voz-backend:
        condition: service_healthy
      clonar-voz-front-build:
        condition: service_completed_successfully
    networks:
      clonar-voz-net:
        ipv4_address: 192.168.93.11
    restart: unless-stopped

  # ---- Conversación por voz con el avatar (puerto 9090) --------------------------
  # STT y LLM quedan cargados en la GPU todo el tiempo.

  clonar-voz-stt:
    # Speech-to-text en español: whisper.cpp con CUDA
    build:
      context: ./stt
      args:
        CUDA_ARCHITECTURES: "121"
    image: clonar-voz-stt:cuda
    container_name: clonar-voz-stt
    user: "1000:1000"
    volumes:
      - ./modelos-stt:/modelos:ro
    command: ["whisper-server", "-m", "/modelos/${STT_MODELO:-ggml-large-v3-turbo.bin}",
              "-l", "es", "--host", "0.0.0.0", "--port", "8080", "-t", "8"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      clonar-voz-net:
        ipv4_address: 192.168.93.16
    restart: unless-stopped

  clonar-voz-llm:
    # llama-server en la GPU en modo router: ofrece todos los .gguf de ./modelos-llm (se
    # eligen en la web de conversación) y mantiene cargados hasta LLM_MAX_MODELOS.
    # Redacta las respuestas y segmenta por emociones para el backend.
    # Usa la imagen del backend (mismo llama.cpp).
    image: clonar-voz-backend:cuda
    pull_policy: never
    container_name: clonar-voz-llm
    user: "1000:1000"
    volumes:
      - ./modelos-llm:/modelos:ro
    command: ["/opt/llama.cpp/llama-server", "--models-dir", "/modelos",
              "--models-max", "${LLM_MAX_MODELOS:-2}",
              "--host", "0.0.0.0", "--port", "8080", "-ngl", "999", "-fa", "on",
              "-c", "${LLM_CONTEXTO:-32768}", "-np", "${LLM_PARALELO:-4}", "--jinja"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      clonar-voz-net:
        ipv4_address: 192.168.93.17
    restart: unless-stopped

  clonar-voz-conversa:
    # Web del asistente por voz (solo el avatar) y orquestación del pipeline
    #   micrófono → STT → RAG (SecondBrain) → LLM → clips de voz + vídeo en paralelo
    build: ./conversa
    image: clonar-voz-conversa:latest
    container_name: clonar-voz-conversa
    user: "1000:1000"
    ports:
      - "9090:8080"
    volumes:
      - ./videos:/videos:ro                # MP4 que genera el backend
      - ./audios/generados:/audios:ro      # WAV del modo «solo audio»
      - ./datos/conversa:/datos            # configuración (SQLite) y registros de reposo/relleno
      - ./modelos-stt:/modelos-stt:ro      # para ofrecer los modelos de Whisper en la web
      - ./avatares:/avatares:ro            # rostro.json de cada avatar (simulación de movimiento)
      - ./conversa/demo:/conocimiento:ro   # respaldo si SecondBrain no está en marcha
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Ollama y ChromaDB de SecondBrain
    environment:
      # El avatar, el fondo y los modelos se eligen en la web («Entrar a la sala») y se
      # guardan en ./datos/conversa/conversa.sqlite3. La primera vez: lo primero disponible.
      - CONVERSA_ESCENA=noche              # fondo la primera vez
      - CONVERSA_STT_MODELO=${STT_MODELO:-ggml-large-v3-turbo.bin}   # el que carga whisper-server
      - CONVERSA_MAX_PALABRAS=260          # ≈ 2 minutos de voz
      # LLM predeterminado en este equipo (el primero que exista); los ligeros quedan de respaldo
      - CONVERSA_LLM_PREFERIDO=Qwen3.5-35B-A3B-Q4_K_M,Qwen3.5-9B-Q4_K_M
      - CONVERSA_CLIPS_EN_PARALELO=1     # uno a la vez: con 3, el primero compartía la GPU y tardaba el doble
      - CONVERSA_VIDEO=1                   # la primera vez: vídeo animado activado
      - CONVERSA_RELLENO=1                 # «Déjame pensarlo, te respondo en breve.» al empezar cada respuesta
      - CONVERSA_OLLAMA_URL=http://host.docker.internal:11434
      - CONVERSA_CHROMA_URL=http://host.docker.internal:8100
      - CONVERSA_DIR_CONOCIMIENTO=/conocimiento
    depends_on:
      clonar-voz-backend:
        condition: service_healthy
      clonar-voz-llm:
        condition: service_healthy
      clonar-voz-stt:
        condition: service_started
    networks:
      clonar-voz-net:
        ipv4_address: 192.168.93.18
    restart: unless-stopped

networks:
  clonar-voz-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.93.0/24
          gateway: 192.168.93.1
